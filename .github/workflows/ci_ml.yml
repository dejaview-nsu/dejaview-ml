name: ML CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

# новый коммит отменяет проверку старого
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  IMAGE: ghcr.io/${{ github.repository }}   

jobs:
  openapi:
    name: OpenAPI lint
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - name: Lint specs
        run: |
          specs=$(git ls-files '*openapi*.yaml')
          if [ -z "$specs" ]; then
            echo "::notice::OpenAPI-файлов в репозитории нет, проверять нечего"
            exit 0
          fi
          docker run --rm \
            -v "${{ github.workspace }}:/spec" \
            redocly/cli:2.54.3 \
            lint --format=github-actions $specs

  service:
    name: Service (ruff, pytest, image)
    needs: [openapi]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
        # очищаю диск, чтобы не упереться в лимит GitHub Actions
      - name: Free disk space
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL

      - uses: actions/checkout@v5

      - name: Build test image
        id: image
        run: docker build --target test -t ml-test .

      - name: Ruff lint
        run: docker run --rm ml-test ruff check .

      # остальные проверки выполняются, даже если предыдущая упала, но только если образ собрался
      - name: Ruff format
        if: ${{ !cancelled() && steps.image.outcome == 'success' }}
        run: docker run --rm ml-test ruff format --check .

      - name: Tests
        if: ${{ !cancelled() && steps.image.outcome == 'success' }}
        run: docker run --rm -e HF_HUB_OFFLINE=1 ml-test pytest

      - name: Build runtime image
        run: docker build -t $IMAGE:${{ github.sha }} -t $IMAGE:latest .

      - name: Login to GHCR
        if: github.event_name == 'push'
        run: echo "${{ github.token }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

      - name: Push
        if: github.event_name == 'push'
        run: |
          docker push $IMAGE:${{ github.sha }}
          docker push $IMAGE:latest

  ci-ok:
    name: CI OK
    if: always()
    needs: [openapi, service]
    runs-on: ubuntu-24.04
    steps:
      - name: Fail if any job failed
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: exit 1
